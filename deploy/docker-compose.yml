version: '3.8'

services:
  # ============================================================
  # Infrastructure Services
  # ============================================================
  
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    restart: always
    volumes:
      - ./local_storage/postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:7.2.3
    restart: always
    volumes:
      - ./local_storage/redis/data:/data
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server /etc/redis/redis.conf

  # ============================================================
  # Application Services (All-in-One mode)
