#      - REDIS_URL=redis://redis:6379/0
#      - QDRANT_HOST=qdrant
#      - QDRANT_PORT=6333
#    ports:
#      - "8000:8000"
#    depends_on:
#      postgres:
#        condition: service_healthy
#      redis:
#        condition: service_healthy
#      qdrant:
#        condition: service_healthy
#    restart: unless-stopped

  # ============================================================
  # Celery Worker
  # ============================================================
  
  celery-worker:
    build:
      context: ./services/workflow-service
      dockerfile: Dockerfile
    container_name: celery-worker
    command: celery -A src.workflow_service.infrastructure.celery.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/demo_main
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

